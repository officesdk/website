name: Build and deploy Office SDK website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: officesdk-production
  cancel-in-progress: false

env:
  DEPLOY_ROOT: /var/www/officesdk
  DEPLOY_HOST: ${{ vars.DEPLOY_HOST || '43.172.115.22' }}
  DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
  DEPLOY_USER: ${{ vars.DEPLOY_USER || 'ubuntu' }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build website
        run: npm run build

      - name: Prepare SSH
        shell: bash
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_KEY" || { echo 'DEPLOY_SSH_KEY is required'; exit 1; }
          test -n "$DEPLOY_KNOWN_HOSTS" || { echo 'DEPLOY_KNOWN_HOSTS is required'; exit 1; }
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/officesdk_deploy"
          chmod 600 "$HOME/.ssh/officesdk_deploy"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Package release
        id: release
        shell: bash
        run: |
          set -euo pipefail
          release_id="${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          tar -czf "$RUNNER_TEMP/officesdk-${release_id}.tgz" -C dist .
          echo "id=$release_id" >> "$GITHUB_OUTPUT"

      - name: Upload release and Nginx configuration
        shell: bash
        env:
          RELEASE_ID: ${{ steps.release.outputs.id }}
        run: |
          set -euo pipefail
          ssh_args=(-i "$HOME/.ssh/officesdk_deploy" -p "$DEPLOY_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes)
          scp_args=(-i "$HOME/.ssh/officesdk_deploy" -P "$DEPLOY_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes)
          scp "${scp_args[@]}" "$RUNNER_TEMP/officesdk-${RELEASE_ID}.tgz" "$DEPLOY_USER@$DEPLOY_HOST:/tmp/officesdk-${RELEASE_ID}.tgz"
          scp "${scp_args[@]}" deploy/nginx/officesdk.conf "$DEPLOY_USER@$DEPLOY_HOST:/tmp/officesdk-${RELEASE_ID}.conf"

      - name: Activate release
        shell: bash
        env:
          RELEASE_ID: ${{ steps.release.outputs.id }}
          DEPLOY_SUDO_PASSWORD: ${{ secrets.DEPLOY_SUDO_PASSWORD }}
        run: |
          set -euo pipefail
          ssh_args=(-i "$HOME/.ssh/officesdk_deploy" -p "$DEPLOY_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes)
          cat > "$RUNNER_TEMP/activate.sh" <<'REMOTE'
          set -Eeuo pipefail
          release_id="$1"
          root="$2"
          deploy_user="$3"
          artifact="/tmp/officesdk-${release_id}.tgz"
          config="/tmp/officesdk-${release_id}.conf"
          previous_release="$(readlink -f "$root/current" || true)"
          config_backup="$root/backups/nginx-${release_id}.conf"
          install -d -m 755 "$root/backups"
          printf '%s\n' "$previous_release" > "$root/backups/previous-release-${release_id}.txt"
          if [ -f /etc/nginx/sites-available/officesdk ]; then
            install -m 644 /etc/nginx/sites-available/officesdk "$config_backup"
          fi
          rollback() {
            result=$?
            trap - ERR
            set +e
            if [ -n "$previous_release" ]; then
              ln -sfn "$previous_release" "$root/current"
            fi
            if [ -f "$config_backup" ]; then
              install -m 644 "$config_backup" /etc/nginx/sites-available/officesdk
            fi
            nginx -t && systemctl reload nginx
            echo "Activation failed; restored the previous release and Nginx configuration."
            exit "$result"
          }
          trap rollback ERR
          install -d -m 755 "$root/releases/$release_id"
          tar -xzf "$artifact" -C "$root/releases/$release_id"
          test -s "$root/releases/$release_id/index.html"
          chown -R "$deploy_user:$deploy_user" "$root/releases/$release_id"
          install -m 644 "$config" /etc/nginx/sites-available/officesdk
          ln -sfn /etc/nginx/sites-available/officesdk /etc/nginx/sites-enabled/officesdk
          nginx -t
          ln -sfn "$root/releases/$release_id" "$root/current"
          systemctl reload nginx
          health_code="$(curl --fail --silent --show-error --max-time 15 -H 'Host: officesdk.com' -H 'X-Forwarded-Proto: https' -o /tmp/officesdk-home.html -w '%{http_code}' http://127.0.0.1/)"
          test "$health_code" = 200
          grep -q 'Office SDK' /tmp/officesdk-home.html
          trap - ERR
          rm -f "$artifact" "$config"
          REMOTE
          chmod 700 "$RUNNER_TEMP/activate.sh"
          if [ -n "$DEPLOY_SUDO_PASSWORD" ]; then
            { printf '%s\n' "$DEPLOY_SUDO_PASSWORD"; cat "$RUNNER_TEMP/activate.sh"; } | ssh "${ssh_args[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "sudo -S -p '' bash -s -- '$RELEASE_ID' '$DEPLOY_ROOT' '$DEPLOY_USER'"
          else
            ssh "${ssh_args[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "sudo -n bash -s -- '$RELEASE_ID' '$DEPLOY_ROOT' '$DEPLOY_USER'" < "$RUNNER_TEMP/activate.sh"
          fi

      - name: Verify public IP
        run: |
          set -euo pipefail
          origin_headers=(-H 'Host: officesdk.com' -H 'X-Forwarded-Proto: https')
          check_origin_route() {
            local route="$1" marker="$2" output="$3" code
            for attempt in 1 2 3 4 5; do
              code=000
              if code="$(curl --fail --silent --show-error --max-time 20 "${origin_headers[@]}" -o "$output" -w '%{http_code}' "http://${DEPLOY_HOST}${route}")"; then
                if [ "$code" = 200 ] && grep -Fq "$marker" "$output"; then
                  echo "Origin ready: $route (HTTP 200)"
                  return 0
                fi
              fi
              echo "Origin not ready: $route (HTTP $code, attempt $attempt/5)"
              if [ "$attempt" != 5 ]; then
                sleep 1
              fi
            done
            return 1
          }
          check_origin_route / 'Office SDK' "$RUNNER_TEMP/officesdk-home.html"
          check_origin_route /blog 'Office SDK Journal' "$RUNNER_TEMP/officesdk-blog.html"
          check_origin_route /robots.txt 'Sitemap:' "$RUNNER_TEMP/officesdk-robots.txt"
          check_origin_route /sitemap.xml 'officesdk.com' "$RUNNER_TEMP/officesdk-sitemap.xml"
