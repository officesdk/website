map $http_x_forwarded_proto $officesdk_request_scheme {
    default $scheme;
    https https;
}

server {
    listen 80;
    listen [::]:80;

    server_name officesdk.com www.officesdk.com 43.172.115.22;

    root /var/www/officesdk/current;
    index index.html;
    charset utf-8;

    if ($host != officesdk.com) {
        return 301 https://officesdk.com$request_uri;
    }

    # Cloudflare terminates HTTPS before forwarding to this HTTP origin.
    if ($officesdk_request_scheme = http) {
        return 301 https://officesdk.com$request_uri;
    }

    location = / {
        try_files /index.html =404;
        add_header Cache-Control "public, max-age=0, s-maxage=3600, must-revalidate";
    }

    location = /index.html {
        return 301 https://officesdk.com/$is_args$args;
    }

    location ~ ^(?<officesdk_index_path>/.+)/index\.html$ {
        return 301 https://officesdk.com$officesdk_index_path$is_args$args;
    }

    location ~ ^(?<officesdk_directory_path>/.+)/$ {
        return 301 https://officesdk.com$officesdk_directory_path$is_args$args;
    }

    # Only Astro's content-hashed build output is immutable.
    location ^~ /_astro/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Product page media uses stable filenames that change between releases;
    # it must revalidate instead of serving stale visuals for hours.
    location ~* ^/product/.+\.(?:png|webp|jpe?g|svg|ico)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    # Stable public filenames can change on a release; never cache them for a year.
    location ~* \.(?:woff2?|png|webp|jpe?g|svg|ico)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=14400, must-revalidate";
    }

    location / {
        try_files $uri $uri/index.html =404;
        add_header Cache-Control "public, max-age=0, s-maxage=3600, must-revalidate";
    }

    location = /404.html {
        internal;
        add_header Cache-Control "no-store" always;
    }

    error_page 404 =404 /404.html;

    location = /robots.txt {
        try_files $uri =404;
    }

    location = /sitemap.xml {
        try_files $uri =404;
    }
}
