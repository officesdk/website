server {
    listen 80;
    listen [::]:80;

    # The IP name makes the site testable before DNS is moved. The domain is
    # ready for the later officesdk.com DNS change without another deploy.
    server_name officesdk.com 43.172.115.22;

    root /var/www/officesdk/current;
    index index.html;
    charset utf-8;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /robots.txt {
        try_files $uri =404;
    }

    location = /sitemap.xml {
        try_files $uri =404;
    }
}
